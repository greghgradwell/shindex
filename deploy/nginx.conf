server {
    listen 80;
    server_name shindex.nextdaynet.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name shindex.nextdaynet.com;

    # Certificates managed by certbot
    ssl_certificate /etc/letsencrypt/live/shindex.nextdaynet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shindex.nextdaynet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;

        # Required for Phoenix LiveView WebSocket connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required for prod.exs force_ssl: rewrite_on: [:x_forwarded_proto]
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep LiveView WebSocket connections alive
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
